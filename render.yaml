services:
  - type: web
    name: sitesignal-delay-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_TECHNICIAN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /tmp/sitesignal/sitesignal.db
      - key: CHROMA_PATH
        value: /tmp/sitesignal/chroma
