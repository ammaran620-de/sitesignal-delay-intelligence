services:
  - type: web
    name: sitesignal-delay-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_TECHNICIAN_PASSWORD
        sync: false
      # Optional. If unset, the sales account is created inactive on this service.
      - key: DEMO_SALES_PASSWORD
        sync: false
      # Marks this as a hosted service: the manager and technician passwords above must be set (12+
      # characters, not a built-in default) or the service refuses to start. Render also sets RENDER=true.
      - key: SITESIGNAL_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/sitesignal/sitesignal.db
      - key: CHROMA_PATH
        value: /tmp/sitesignal/chroma
